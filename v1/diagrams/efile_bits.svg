<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 310" width="240" height="310">
  <!-- NailPass original diagram: an electric file sanding band on a mandrel, side view. Schematic. No text: labels come from the glossary. -->
  <g stroke-linejoin="round">
    <rect id="part_mandrel_shank" x="114" y="200" width="12" height="90" rx="3" fill="#C9CDD2" stroke="#7E8790" stroke-width="2"/>
    <rect id="part_mandrel_core" x="110" y="100" width="20" height="104" rx="4" fill="#C9CDD2" stroke="#7E8790" stroke-width="2"/>
    <g id="part_mandrel_sanding_band">
      <rect x="92" y="110" width="56" height="92" rx="6" fill="#D9C7A8" stroke="#8F7A55" stroke-width="2.5"/>
      <line x1="120" y1="110" x2="120" y2="202" stroke="#8F7A55" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
  </g>
  <g class="hotspots" fill="#C85A70" fill-opacity="0" stroke="none">
    <circle class="hotspot" id="mandrel_sanding_band" cx="120" cy="156" r="32"/>
  </g>
</svg>
